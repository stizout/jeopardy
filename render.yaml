services:
  - type: web
    name: the-den
    runtime: node
    plan: free
    healthCheckPath: /api/health
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PUBLIC_URL
        value: https://jeopardy-rg3b.onrender.com
